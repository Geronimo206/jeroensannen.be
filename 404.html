<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Not found — Jeroen Sannen</title>
	<meta name="robots" content="noindex" />
	<meta name="theme-color" content="#b98f60" />
	<meta name="color-scheme" content="light" />
	<link rel="icon" href="/favicon.ico" sizes="32x32" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" />
	<!-- Same desk as the homepage; absolute path because this page answers for any missing URL. -->
	<link rel="stylesheet" href="/assets/site.css" />
	<style>
		body { display: grid; place-items: center; padding: 24px 16px; }
		.lost { position: relative; z-index: 1; width: min(100%, 460px); container-type: inline-size; }
		.lost__sleeve {
			aspect-ratio: 1;
			display: grid;
			align-content: space-between;
			padding: 9cqi 8cqi;
			background: #f5f6f7;
			color: #1a1a1a;
			border-radius: 2px;
			box-shadow: 0 3cqi 7cqi -2cqi rgb(var(--shadow) / .6), 0 .4cqi 1cqi rgb(var(--shadow) / .35);
		}
		.lost h1 {
			font-size: 17cqi;
			font-weight: 250;
			line-height: 1;
			font-stretch: 125%;
			letter-spacing: -.01em;
			color: rgb(136 141 148 / .92);
		}
		.lost h1::after { content: "."; }
		.lost__side {
			margin-top: 3cqi;
			font-size: max(8px, 2.4cqi);
			line-height: 1.2;
			font-stretch: 125%;
			letter-spacing: .24em;
			text-transform: uppercase;
			color: #9ba0a6;
		}
		.lost ol { list-style: none; display: grid; gap: 1.6cqi; text-transform: uppercase; font-stretch: 112%; }
		.lost li { font-size: max(12px, 4.6cqi); font-weight: 350; }
		.lost li:nth-child(1) { color: #c9cac7; }
		.lost li:nth-child(2) { color: #8e8f8c; }
		.lost li:nth-child(3) { color: #1a1a1a; }
		.lost a { text-decoration: underline; text-decoration-color: rgb(0 0 0 / .25); text-underline-offset: .18em; }
		.lost a:hover { text-decoration-color: currentColor; }
	</style>
</head>
<body>
	<div class="room" aria-hidden="true"></div>
	<main class="lost">
		<div class="lost__sleeve">
			<header>
				<h1>404</h1>
				<p class="lost__side">Side C — track not found</p>
			</header>
			<ol>
				<li>This one never</li>
				<li>made the record</li>
				<li><a href="/">Back to the record</a></li>
			</ol>
		</div>
	</main>
</body>
</html>
